<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoDam-Design-Kit 대시보드</title>
<style>
  :root {
    --bg: #fbf9f4;
    --bg-elevated: #ffffff;
    --text: #262220;
    --text-muted: #6b6259;
    --border: #e4ddd0;
    --accent: #a8562f;
    --pass-bg: #dafbe1;
    --pass-text: #1a7f37;
    --fail-bg: #ffebe9;
    --fail-text: #cf222e;
    --code-bg: #f6f1e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem clamp(1rem, 4vw, 3rem);
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1.5rem; }
  #runs { max-width: 760px; }
  .empty, .load-error { color: var(--text-muted); }
  .load-error { color: var(--fail-text); }
  .run-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    background: var(--bg-elevated);
  }
  .run-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .run-id { font-weight: 600; font-family: ui-monospace, monospace; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-pass { background: var(--pass-bg); color: var(--pass-text); }
  .badge-fail { background: var(--fail-bg); color: var(--fail-text); }
  .run-target { color: var(--text-muted); margin: 0.4rem 0 0.75rem; font-size: 0.92rem; }
  .run-toggle {
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    border-radius: 8px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
    font-size: 0.88rem;
  }
  .run-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .run-detail { margin-top: 0.85rem; }
  .run-report-content {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--code-bg);
    padding: 0.85rem;
    border-radius: 8px;
    font-size: 0.85rem;
    max-height: 420px;
    overflow: auto;
    margin: 0;
  }
  .screenshots { display: flex; gap: 0.85rem; margin-top: 0.85rem; flex-wrap: wrap; }
  .screenshot { text-align: center; }
  .screenshot img { max-width: 180px; border: 1px solid var(--border); border-radius: 6px; display: block; }
  .screenshot-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }
  .run-error { color: var(--fail-text); font-size: 0.88rem; }
</style>
</head>
<body data-token="__DESIGN_KIT_TOKEN__">
  <h1>SoDam-Design-Kit — 검증 이력</h1>
  <div id="runs"></div>
  <script src="/dashboard.js"></script>
</body>
</html>
